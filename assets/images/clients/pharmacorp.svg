<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Medical cross symbol -->
  <rect x="170" y="80" width="60" height="240" fill="url(#blueGrad)" rx="8"/>
  <rect x="110" y="170" width="180" height="60" fill="url(#blueGrad)" rx="8"/>
  
  <!-- Circle background -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.3"/>
  
  <!-- Company name -->
  <text x="200" y="320" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">PharmaCorp</text>
  
  <!-- Tagline -->
  <text x="200" y="345" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Healthcare Solutions</text>
</svg>
